<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Fútbol Club | Inicio</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        
        /* Partículas de fondo animadas */
        body::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: moveBackground 20s linear infinite;
            z-index: 0;
        }
        
        @keyframes moveBackground {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }
        
        /* Esferas decorativas */
        body::after {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(255,255,255,0.1), transparent);
            border-radius: 50%;
            top: -200px;
            right: -200px;
            animation: float 15s ease-in-out infinite;
            z-index: 0;
        }
        
        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-50px, 50px) scale(1.1); }
        }
        
        .container {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 60px 50px;
            max-width: 700px;
            animation: fadeInUp 0.8s ease;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        h1 {
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            position: relative;
        }
        
        h1::before {
            content: '⚽';
            position: absolute;
            left: -60px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 3rem;
            animation: bounce 2s infinite;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(-50%) scale(1); }
            50% { transform: translateY(-60%) scale(1.1); }
        }
        
        .lead {
            color: #4a5568;
            font-size: 1.1rem;
            line-height: 1.8;
            font-weight: 500;
        }
        
        hr {
            border: none;
            height: 3px;
            background: linear-gradient(90deg, transparent, #667eea, #764ba2, transparent);
            margin: 30px 0;
            border-radius: 10px;
            opacity: 0.6;
        }
        
        .btn-success {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            padding: 18px 50px;
            font-size: 1.2rem;
            font-weight: 700;
            border-radius: 50px;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .btn-success::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }
        
        .btn-success:hover::before {
            width: 400px;
            height: 400px;
        }
        
        .btn-success:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.6);
        }
        
        .btn-success i {
            margin-right: 10px;
            font-size: 1.3rem;
        }
        
        /* Badge decorativo */
        .badge-demo {
            display: inline-block;
            background: linear-gradient(135deg, #f093fb, #f5576c);
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(245, 87, 108, 0.3);
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        /* Iconos decorativos flotantes */
        .floating-icon {
            position: absolute;
            font-size: 2rem;
            opacity: 0.15;
            animation: floatRandom 10s ease-in-out infinite;
        }
        
        .icon-1 { top: 10%; left: 5%; animation-delay: 0s; }
        .icon-2 { top: 80%; left: 10%; animation-delay: 2s; }
        .icon-3 { top: 20%; right: 8%; animation-delay: 4s; }
        .icon-4 { bottom: 15%; right: 5%; animation-delay: 6s; }
        
        @keyframes floatRandom {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(10px, -10px) rotate(90deg); }
            50% { transform: translate(-10px, 10px) rotate(180deg); }
            75% { transform: translate(10px, 10px) rotate(270deg); }
        }
        
        /* Info cards */
        .info-card {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1), rgba(118, 75, 162, 0.1));
            border-radius: 15px;
            padding: 20px;
            margin-top: 30px;
            border: 2px solid rgba(102, 126, 234, 0.2);
            transition: all 0.3s ease;
        }
        
        .info-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.2);
        }
        
        .info-card i {
            font-size: 2.5rem;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .info-card h5 {
            color: #667eea;
            font-weight: 700;
            margin-top: 10px;
        }
        
        .info-card p {
            color: #4a5568;
            font-size: 0.9rem;
            margin: 0;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 40px 30px;
                margin: 20px;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            h1::before {
                display: none;
            }
            
            .btn-success {
                padding: 15px 35px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body class="bg-light text-center">
    <!-- Iconos decorativos flotantes -->
    <i class="bi bi-trophy-fill floating-icon icon-1"></i>
    <i class="bi bi-star-fill floating-icon icon-2"></i>
    <i class="bi bi-award-fill floating-icon icon-3"></i>
    <i class="bi bi-shield-fill-check floating-icon icon-4"></i>
    
    <div class="container mt-5">
        <div class="badge-demo">
            <i class="bi bi-code-square"></i> Proyecto Demo
        </div>
        
        <h1 class="display-5 fw-bold text-primary">Sistema de Gestión Fútbol Club</h1>
        
        <p class="lead mt-3">Proyecto demostrativo de relaciones JPA con Spring Boot, Thymeleaf y H2.</p>
        
        <hr>
        
        <!-- Cards informativos -->
        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <div class="info-card">
                    <i class="bi bi-server"></i>
                    <h5>Spring Boot</h5>
                    <p>Backend robusto</p>
                </div>
            </div>
            <div class="col-md-4">
                <div class="info-card">
                    <i class="bi bi-database"></i>
                    <h5>JPA + H2</h5>
                    <p>Persistencia de datos</p>
                </div>
            </div>
            <div class="col-md-4">
                <div class="info-card">
                    <i class="bi bi-file-earmark-code"></i>
                    <h5>Thymeleaf</h5>
                    <p>Plantillas dinámicas</p>
                </div>
            </div>
        </div>
        
        <a href="/listar" class="btn btn-success btn-lg mt-4">
            <i class="bi bi-list-check"></i>Ver Clubes Registrados
        </a>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
