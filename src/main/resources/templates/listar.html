<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Lista de Clubes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }
        
        /* Patrón de fondo animado */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 25% 25%, rgba(255,255,255,0.08) 2px, transparent 2px),
                radial-gradient(circle at 75% 75%, rgba(255,255,255,0.08) 2px, transparent 2px);
            background-size: 80px 80px;
            animation: movePattern 30s linear infinite;
            z-index: 0;
        }
        
        @keyframes movePattern {
            0% { background-position: 0 0; }
            100% { background-position: 80px 80px; }
        }
        
        /* Esferas decorativas */
        body::after {
            content: '';
            position: fixed;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(255,255,255,0.05), transparent);
            border-radius: 50%;
            top: -200px;
            right: -200px;
            animation: float 20s ease-in-out infinite;
            z-index: 0;
        }
        
        @keyframes float {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(-100px, 100px) rotate(180deg); }
        }
        
        /* Navbar mejorado */
        .navbar {
            background: linear-gradient(135deg, #1e293b, #334155) !important;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
            padding: 1.2rem 0;
            position: relative;
            z-index: 100;
            border-bottom: 3px solid rgba(102, 126, 234, 0.5);
        }
        
        .navbar-brand {
            font-weight: 800;
            font-size: 1.6rem;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .navbar-brand:hover {
            transform: scale(1.05);
            color: #06b6d4 !important;
        }
        
        .navbar-brand::before {
            content: '⚽';
            font-size: 2rem;
            animation: spin 4s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .btn-success {
            background: linear-gradient(135deg, #10b981, #059669) !important;
            border: none;
            font-weight: 700;
            padding: 10px 25px;
            border-radius: 25px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }
        
        .btn-success:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.5);
            background: linear-gradient(135deg, #059669, #10b981) !important;
        }
        
        /* Container */
        .container {
            position: relative;
            z-index: 10;
            padding: 2rem 1rem 3rem;
        }
        
        /* Título mejorado */
        h2 {
            background: white;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 800;
            font-size: 2.8rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            margin-bottom: 2.5rem;
            animation: fadeInDown 0.6s ease;
            position: relative;
        }
        
        h2::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 4px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 2px;
        }
        
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* Alertas mejoradas */
        .alert {
            border: none;
            border-radius: 15px;
            font-weight: 600;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            animation: slideInDown 0.5s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        @keyframes slideInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .alert::before {
            font-size: 1.5rem;
        }
        
        .alert-success {
            background: linear-gradient(135deg, #34d399, #10b981);
            color: white;
        }
        
        .alert-success::before {
            content: '✅';
        }
        
        .alert-danger {
            background: linear-gradient(135deg, #f87171, #ef4444);
            color: white;
        }
        
        .alert-danger::before {
            content: '⚠️';
        }
        
        /* Tabla mejorada */
        .table {
            background: rgba(255, 255, 255, 0.98) !important;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: fadeInUp 0.8s ease;
            border: none;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* Header de la tabla */
        .table-dark {
            background: linear-gradient(135deg, #1e293b, #334155) !important;
            border: none;
        }
        
        thead th {
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 1.2rem 1rem;
            border: none !important;
            font-size: 0.9rem;
            color: white !important;
            position: relative;
        }
        
        thead th::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #667eea, #764ba2, #06b6d4);
        }
        
        /* Filas de la tabla */
        tbody tr {
            transition: all 0.3s ease;
            border-bottom: 1px solid #e5e7eb;
        }
        
        tbody tr:hover {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.08), rgba(118, 75, 162, 0.08));
            transform: scale(1.01);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        tbody td {
            padding: 1rem;
            vertical-align: middle;
            font-weight: 500;
            color: #374151;
            border: none !important;
        }
        
        tbody tr:last-child {
            border-bottom: none;
        }
        
        /* ID badge */
        tbody td:first-child {
            font-weight: 700;
            color: #667eea;
            font-size: 1.1rem;
        }
        
        /* Lista de competiciones */
        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        
        ul li {
            padding: 5px 12px;
            margin: 3px 0;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1), rgba(118, 75, 162, 0.1));
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #667eea;
            display: inline-block;
            margin-right: 5px;
            transition: all 0.3s ease;
        }
        
        ul li:hover {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            transform: scale(1.05);
        }
        
        ul li::before {
            content: '🏆';
            margin-right: 5px;
        }
        
        /* Botones de acción */
        .btn-primary {
            background: linear-gradient(135deg, #3b82f6, #2563eb) !important;
            border: none;
            padding: 8px 20px;
            font-weight: 600;
            border-radius: 20px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
            font-size: 0.9rem;
        }
        
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.5);
            background: linear-gradient(135deg, #2563eb, #1d4ed8) !important;
        }
        
        .btn-success.btn-sm {
            background: linear-gradient(135deg, #10b981, #059669) !important;
            border: none;
            padding: 8px 20px;
            font-weight: 600;
            border-radius: 20px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
            font-size: 0.9rem;
        }
        
        .btn-success.btn-sm:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.5);
            background: linear-gradient(135deg, #059669, #047857) !important;
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #ef4444, #dc2626) !important;
            border: none;
            padding: 8px 20px;
            font-weight: 600;
            border-radius: 20px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
            font-size: 0.9rem;
        }
        
        .btn-danger:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(239, 68, 68, 0.5);
            background: linear-gradient(135deg, #dc2626, #b91c1c) !important;
        }
        
        .btn-sm {
            margin: 3px;
        }
        
        /* Tabla responsiva mejorada */
        .table-responsive {
            border-radius: 20px;
            overflow: hidden;
        }
        
        /* Badge contador */
        .badge-counter {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 15px 25px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1rem;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
            z-index: 100;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        .badge-counter i {
            margin-right: 8px;
            font-size: 1.2rem;
        }
        
        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }
        
        .empty-state i {
            font-size: 5rem;
            color: #e5e7eb;
            margin-bottom: 1rem;
        }
        
        .empty-state h4 {
            color: #6b7280;
            font-weight: 600;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            h2 {
                font-size: 2rem;
            }
            
            .navbar-brand::before {
                font-size: 1.5rem;
            }
            
            .table {
                font-size: 0.85rem;
            }
            
            thead th {
                padding: 0.8rem 0.5rem;
                font-size: 0.75rem;
            }
            
            tbody td {
                padding: 0.8rem 0.5rem;
            }
            
            .btn-sm {
                padding: 6px 12px;
                font-size: 0.8rem;
            }
            
            .badge-counter {
                bottom: 20px;
                right: 20px;
                padding: 12px 20px;
                font-size: 0.9rem;
            }
        }
        
        /* Scroll suave */
        html {
            scroll-behavior: smooth;
        }
        
        /* Loader para filas */
        @keyframes shimmer {
            0% { background-position: -1000px 0; }
            100% { background-position: 1000px 0; }
        }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">Fútbol Club</a>
        <a class="btn btn-success" th:href="@{/nuevo}">
            <i class="bi bi-plus-circle me-2"></i>Nuevo Club
        </a>
    </div>
</nav>

<div class="container">
    <h2 class="mb-4 text-center">Lista de Clubes Registrados</h2>

    <!-- Mensajes -->
    <div th:if="${success}" class="alert alert-success" role="alert" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>

    <div class="table-responsive">
        <table class="table table-striped table-bordered shadow">
            <thead class="table-dark text-center">
                <tr>
                    <th><i class="bi bi-hash me-1"></i>ID</th>
                    <th><i class="bi bi-shield-fill me-1"></i>Nombre</th>
                    <th><i class="bi bi-geo-alt-fill me-1"></i>Ciudad</th>
                    <th><i class="bi bi-person-fill me-1"></i>Entrenador</th>
                    <th><i class="bi bi-building me-1"></i>Asociación</th>
                    <th><i class="bi bi-trophy-fill me-1"></i>Competiciones</th>
                    <th><i class="bi bi-gear-fill me-1"></i>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="club, iterStat : ${clubes}">
                    <td th:text="${club.id}" class="text-center"></td>
                    <td th:text="${club.nombre}" class="fw-bold"></td>
                    <td th:text="${club.ciudad}"></td>
                    <td th:text="${club.entrenador.nombre + ' ' + club.entrenador.apellido}"></td>
                    <td th:text="${club.asociacion.nombre}"></td>
                    <td>
                        <ul>
                            <li th:each="comp : ${club.competiciones}" th:text="${comp.nombre}"></li>
                        </ul>
                    </td>
                    <td class="text-center">
                        <a th:href="@{/editar/{id}(id=${club.id})}" class="btn btn-primary btn-sm">
                            <i class="bi bi-pencil-fill"></i> Editar
                        </a>
                        <a th:href="@{/club/{id}/jugadores(id=${club.id})}" class="btn btn-success btn-sm">
                            <i class="bi bi-people-fill"></i> Jugadores
                        </a>
                        <a th:href="@{/eliminar/{id}(id=${club.id})}" class="btn btn-danger btn-sm"
                           onclick="return confirm('¿Seguro que deseas eliminar este club?');">
                            <i class="bi bi-trash-fill"></i> Eliminar
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Badge contador de clubes -->
<div class="badge-counter">
    <i class="bi bi-list-ul"></i>
    <span th:text="${#lists.size(clubes)} + ' Clubes'">0 Clubes</span>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
