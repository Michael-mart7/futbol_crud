<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Clubes en Competición</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image:
                radial-gradient(circle at 25% 25%, rgba(255,255,255,0.08) 2px, transparent 2px),
                radial-gradient(circle at 75% 75%, rgba(255,255,255,0.08) 2px, transparent 2px);
            background-size: 80px 80px;
            animation: movePattern 30s linear infinite;
            z-index: 0;
        }
        @keyframes movePattern {
            0% { background-position: 0 0; }
            100% { background-position: 80px 80px; }
        }
        .container { position: relative; z-index: 10; padding: 2rem 1rem 3rem; }
        h2 {
            background: white;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 800;
            font-size: 2.8rem;
            margin-bottom: 2.5rem;
            text-align: center;
            position: relative;
        }
        h2::before { content: '🏆'; margin-right: 15px; }
        h2::after {
            content: '';
            position: absolute;
            bottom: -10px; left: 50%;
            transform: translateX(-50%);
            width: 100px; height: 4px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 2px;
        }
        .table {
            background: rgba(255,255,255,0.98) !important;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            border: none;
        }
        thead th {
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 1.2rem 1rem;
            border: none !important;
            font-size: 0.9rem;
            color: #1e293b !important;
            background: linear-gradient(135deg, #f1f5f9, #e2e8f0);
            position: relative;
        }
        thead th::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, #667eea, #764ba2, #06b6d4);
        }
        tbody tr {
            transition: all 0.3s ease;
            border-bottom: 1px solid #e5e7eb;
        }
        tbody tr:hover {
            background: linear-gradient(135deg, rgba(102,126,234,0.08), rgba(118,75,162,0.08));
            transform: scale(1.01);
        }
        tbody td {
            padding: 1rem;
            vertical-align: middle;
            font-weight: 500;
            color: #374151;
            border: none !important;
        }
        .btn-volver {
            background: linear-gradient(135deg, #64748b, #475569);
            border: none;
            padding: 12px 35px;
            font-weight: 700;
            border-radius: 50px;
            color: white;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(71,85,105,0.3);
            text-decoration: none;
        }
        .btn-volver:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(71,85,105,0.5);
            background: linear-gradient(135deg, #475569, #334155);
            color: white;
        }
        .badge-counter {
            position: fixed;
            bottom: 30px; right: 30px;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
            padding: 15px 25px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1rem;
            box-shadow: 0 10px 30px rgba(245,158,11,0.4);
            z-index: 100;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
    </style>
</head>
<body>
<div class="container mt-5">
    <h2 th:text="${competicion.nombre}"></h2>

    <div class="table-responsive mt-4">
        <table class="table table-striped">
            <thead>
                <tr>
                    <th><i class="bi bi-shield-fill me-1"></i>Club</th>
                    <th><i class="bi bi-geo-alt-fill me-1"></i>Ciudad</th>
                    <th><i class="bi bi-person-fill me-1"></i>Entrenador</th>
                    <th><i class="bi bi-building me-1"></i>Asociación</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="club : ${clubes}">
                    <td th:text="${club.nombre}" class="fw-bold"></td>
                    <td th:text="${club.ciudad}"></td>
                    <td th:text="${club.entrenador != null} ? ${club.entrenador.nombre + ' ' + club.entrenador.apellido} : 'Sin entrenador'"></td>
                    <td th:text="${club.asociacion != null} ? ${club.asociacion.nombre} : 'Sin asociación'"></td>
                </tr>
            </tbody>
        </table>
    </div>

	<div class="container mb-5 d-flex gap-3">
	    <a th:href="@{/competiciones}" class="btn btn-warning btn-lg flex-fill">
	        <i class="bi bi-trophy-fill me-2"></i> Ver Competiciones
	    </a>
	    <a th:href="@{/entrenadores}" class="btn btn-info btn-lg flex-fill" style="color:white;">
	        <i class="bi bi-person-badge-fill me-2"></i> Gestionar Entrenadores
	    </a>
	</div>
</div>

<div class="badge-counter">
    <i class="bi bi-trophy-fill me-2"></i>
    <span th:text="${#lists.size(clubes)} + ' Clubes'">0 Clubes</span>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
