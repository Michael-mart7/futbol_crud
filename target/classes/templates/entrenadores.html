<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Entrenadores</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image:
                radial-gradient(circle at 25% 25%, rgba(255,255,255,0.08) 2px, transparent 2px),
                radial-gradient(circle at 75% 75%, rgba(255,255,255,0.08) 2px, transparent 2px);
            background-size: 80px 80px;
            animation: movePattern 30s linear infinite;
            z-index: 0;
        }
        @keyframes movePattern {
            0% { background-position: 0 0; }
            100% { background-position: 80px 80px; }
        }
        .container { position: relative; z-index: 10; padding: 2rem 1rem 3rem; }
        h2 {
            background: white;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 800;
            font-size: 2.8rem;
            margin-bottom: 2.5rem;
            text-align: center;
            position: relative;
        }
        h2::before { content: '👨‍💼'; margin-right: 15px; }
        h2::after {
            content: '';
            position: absolute;
            bottom: -10px; left: 50%;
            transform: translateX(-50%);
            width: 100px; height: 4px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 2px;
        }
        .alert-success {
            background: linear-gradient(135deg, #34d399, #10b981);
            color: white;
            border: none;
            border-radius: 15px;
            font-weight: 600;
            padding: 1rem 1.5rem;
            margin-bottom: 1.5rem;
        }
        .table {
            background: rgba(255,255,255,0.98) !important;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            border: none;
        }
        thead th {
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 1.2rem 1rem;
            border: none !important;
            font-size: 0.9rem;
            color: #1e293b !important;
            background: linear-gradient(135deg, #f1f5f9, #e2e8f0);
            position: relative;
        }
        thead th::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, #667eea, #764ba2, #06b6d4);
        }
        tbody tr {
            transition: all 0.3s ease;
            border-bottom: 1px solid #e5e7eb;
        }
        tbody tr:hover {
            background: linear-gradient(135deg, rgba(102,126,234,0.08), rgba(118,75,162,0.08));
            transform: scale(1.01);
        }
        tbody td {
            padding: 1rem;
            vertical-align: middle;
            font-weight: 500;
            color: #374151;
            border: none !important;
        }
        .btn-primary {
            background: linear-gradient(135deg, #3b82f6, #2563eb) !important;
            border: none; padding: 8px 20px;
            font-weight: 600; border-radius: 20px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(59,130,246,0.3);
            font-size: 0.9rem;
        }
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(59,130,246,0.5);
        }
        .btn-danger {
            background: linear-gradient(135deg, #ef4444, #dc2626) !important;
            border: none; padding: 8px 20px;
            font-weight: 600; border-radius: 20px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(239,68,68,0.3);
            font-size: 0.9rem;
        }
        .btn-danger:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(239,68,68,0.5);
        }
        .btn-success-new {
            background: linear-gradient(135deg, #10b981, #059669);
            border: none; padding: 12px 30px;
            font-weight: 700; border-radius: 25px;
            color: white; text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(16,185,129,0.3);
            display: inline-block;
        }
        .btn-success-new:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(16,185,129,0.5);
            color: white;
        }
        .btn-volver {
            background: linear-gradient(135deg, #64748b, #475569);
            border: none; padding: 12px 30px;
            font-weight: 700; border-radius: 25px;
            color: white; text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(71,85,105,0.3);
            display: inline-block;
        }
        .btn-volver:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(71,85,105,0.5);
            color: white;
        }
        .btn-sm { margin: 3px; }
        .badge-counter {
            position: fixed;
            bottom: 30px; right: 30px;
            background: linear-gradient(135deg, #06b6d4, #0284c7);
            color: white;
            padding: 15px 25px;
            border-radius: 50px;
            font-weight: 700; font-size: 1rem;
            box-shadow: 0 10px 30px rgba(6,182,212,0.4);
            z-index: 100;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
    </style>
</head>
<body>
<div class="container mt-5">
    <h2>Entrenadores</h2>

    <div th:if="${success}" class="alert-success" th:text="${success}"></div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <a th:href="@{/entrenadores/nuevo}" class="btn-success-new">
            <i class="bi bi-person-plus-fill me-2"></i>Nuevo Entrenador
        </a>
        <a th:href="@{/listar}" class="btn-volver">
            <i class="bi bi-arrow-left-circle me-2"></i>Volver
        </a>
    </div>

    <div class="table-responsive">
        <table class="table table-striped">
            <thead>
                <tr>
                    <th><i class="bi bi-person-fill me-1"></i>Nombre</th>
                    <th><i class="bi bi-person-fill me-1"></i>Apellido</th>
                    <th><i class="bi bi-calendar me-1"></i>Edad</th>
                    <th><i class="bi bi-globe me-1"></i>Nacionalidad</th>
                    <th><i class="bi bi-gear-fill me-1"></i>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="e : ${entrenadores}">
                    <td th:text="${e.nombre}" class="fw-bold"></td>
                    <td th:text="${e.apellido}"></td>
                    <td th:text="${e.edad}"></td>
                    <td th:text="${e.nacionalidad}"></td>
                    <td class="text-center">
                        <a th:href="@{/entrenadores/editar/{id}(id=${e.id})}" class="btn btn-primary btn-sm">
                            <i class="bi bi-pencil-fill"></i> Editar
                        </a>
                        <a th:href="@{/entrenadores/eliminar/{id}(id=${e.id})}" class="btn btn-danger btn-sm"
                           onclick="return confirm('¿Seguro que deseas eliminar este entrenador?');">
                            <i class="bi bi-trash-fill"></i> Eliminar
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<div class="badge-counter">
    <i class="bi bi-people-fill me-2"></i>
    <span th:text="${#lists.size(entrenadores)} + ' Entrenadores'">0 Entrenadores</span>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
