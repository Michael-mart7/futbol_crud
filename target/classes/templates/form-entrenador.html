<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario Entrenador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image:
                radial-gradient(circle at 25% 25%, rgba(255,255,255,0.08) 2px, transparent 2px),
                radial-gradient(circle at 75% 75%, rgba(255,255,255,0.08) 2px, transparent 2px);
            background-size: 80px 80px;
            animation: movePattern 30s linear infinite;
            z-index: 0;
        }
        @keyframes movePattern {
            0% { background-position: 0 0; }
            100% { background-position: 80px 80px; }
        }
        .container { position: relative; z-index: 10; padding: 2rem 1rem 3rem; }
        h2 {
            background: white;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 800;
            font-size: 2.5rem;
            margin-bottom: 2rem;
            text-align: center;
        }
        .form-card {
            background: rgba(255,255,255,0.98);
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
            max-width: 600px;
            margin: 0 auto;
        }
        .form-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 4px;
            background: linear-gradient(90deg, #667eea, #764ba2, #06b6d4);
        }
        .form-label {
            font-weight: 600;
            color: #374151;
            margin-bottom: 0.4rem;
        }
        .form-control {
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            padding: 12px 18px;
            font-size: 1rem;
            font-weight: 500;
            transition: all 0.3s ease;
            background: #f9fafb;
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102,126,234,0.15);
            background: white;
        }
        .btn-guardar {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none; padding: 14px 40px;
            font-size: 1.1rem; font-weight: 700;
            border-radius: 50px; color: white;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(102,126,234,0.4);
        }
        .btn-guardar:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(102,126,234,0.6);
            color: white;
        }
        .btn-cancelar {
            background: linear-gradient(135deg, #64748b, #475569);
            border: none; padding: 14px 40px;
            font-size: 1.1rem; font-weight: 700;
            border-radius: 50px; color: white;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(71,85,105,0.3);
            display: inline-block;
        }
        .btn-cancelar:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(71,85,105,0.5);
            color: white;
        }
    </style>
</head>
<body>
<div class="container mt-5">
    <h2 th:text="${accion} + ' Entrenador'"></h2>

    <div class="form-card">
        <form th:action="@{/entrenadores/guardar}" th:object="${entrenador}" method="post">
            <input type="hidden" th:field="*{id}">

            <div class="mb-3">
                <label class="form-label"><i class="bi bi-person-fill me-1"></i>Nombre</label>
                <input type="text" th:field="*{nombre}" class="form-control" placeholder="Nombre" required>
            </div>
            <div class="mb-3">
                <label class="form-label"><i class="bi bi-person-fill me-1"></i>Apellido</label>
                <input type="text" th:field="*{apellido}" class="form-control" placeholder="Apellido" required>
            </div>
            <div class="mb-3">
                <label class="form-label"><i class="bi bi-calendar me-1"></i>Edad</label>
                <input type="number" th:field="*{edad}" class="form-control" placeholder="Edad" required>
            </div>
            <div class="mb-3">
                <label class="form-label"><i class="bi bi-globe me-1"></i>Nacionalidad</label>
                <input type="text" th:field="*{nacionalidad}" class="form-control" placeholder="Nacionalidad" required>
            </div>

            <div class="d-flex gap-3 mt-4">
                <button type="submit" class="btn-guardar">
                    <i class="bi bi-check-circle-fill me-2"></i>Guardar
                </button>
                <a th:href="@{/entrenadores}" class="btn-cancelar">
                    <i class="bi bi-x-circle-fill me-2"></i>Cancelar
                </a>
            </div>
        </form>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
