<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Jugadores - [[${club.nombre}]]</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }
        
        /* Patrón de fondo */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(255,255,255,0.1) 2px, transparent 2px),
                radial-gradient(circle at 80% 70%, rgba(255,255,255,0.1) 2px, transparent 2px);
            background-size: 100px 100px;
            animation: movePattern 25s linear infinite;
            z-index: 0;
        }
        
        @keyframes movePattern {
            0% { background-position: 0 0; }
            100% { background-position: 100px 100px; }
        }
        
        /* Esferas flotantes */
        body::after {
            content: '';
            position: fixed;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(255,255,255,0.08), transparent);
            border-radius: 50%;
            top: -150px;
            right: -150px;
            animation: float 18s ease-in-out infinite;
            z-index: 0;
        }
        
        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-80px, 80px) scale(1.1); }
        }
        
        /* Container principal */
        .container {
            position: relative;
            z-index: 10;
            animation: fadeIn 0.8s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        /* Título principal */
        h2 {
            background: white;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 800;
            font-size: 2.8rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            margin-bottom: 2rem;
            animation: fadeInDown 0.6s ease;
            position: relative;
            padding-bottom: 15px;
        }
        
        h2::before {
            content: '⚽';
            margin-right: 15px;
            animation: bounce 2s infinite;
        }
        
        h2::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 150px;
            height: 4px;
            background: linear-gradient(90deg, white, transparent);
            border-radius: 2px;
        }
        
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(180deg); }
        }
        
        /* Alerta de éxito */
        .alert-success {
            background: linear-gradient(135deg, #34d399, #10b981);
            color: white;
            border: none;
            border-radius: 15px;
            font-weight: 600;
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.3);
            animation: slideInDown 0.5s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .alert-success::before {
            content: '✅';
            font-size: 1.5rem;
        }
        
        @keyframes slideInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* Tabla mejorada */
        .table {
            background: rgba(255, 255, 255, 0.98) !important;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: fadeInUp 0.8s ease;
            border: none;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* Headers de tabla */
        thead {
            background: linear-gradient(135deg, #1e293b, #334155);
            position: relative;
        }
        
        thead th {
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 1.2rem 1rem;
            border: none !important;
            font-size: 0.9rem;
            color: rgb(128, 0, 255) !important;
        }
        
        thead::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #667eea, #764ba2, #06b6d4);
        }
        
        thead th:first-child::before {
            content: '🆔';
            margin-right: 8px;
        }
        
        thead th:nth-child(2)::before {
            content: '👤';
            margin-right: 8px;
        }
        
        thead th:nth-child(3)::before {
            content: '📝';
            margin-right: 8px;
        }
        
        thead th:nth-child(4)::before {
            content: '🔢';
            margin-right: 8px;
        }
        
        thead th:nth-child(5)::before {
            content: '⚡';
            margin-right: 8px;
        }
        
        /* Filas de tabla */
        tbody tr {
            transition: all 0.3s ease;
            border-bottom: 1px solid #e5e7eb;
        }
        
        tbody tr:hover {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1), rgba(118, 75, 162, 0.1));
            transform: scale(1.02);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        tbody td {
            padding: 1rem;
            vertical-align: middle;
            font-weight: 500;
            color: #374151;
            border: none !important;
        }
        
        tbody tr:last-child {
            border-bottom: none;
        }
        
        /* ID badge */
        tbody td:first-child {
            font-weight: 700;
            color: #667eea;
            font-size: 1.1rem;
            text-align: center;
        }
        
        /* Número del jugador */
        tbody td:nth-child(4) {
            font-weight: 700;
            font-size: 1.3rem;
            color: #764ba2;
            text-align: center;
        }
        
        /* Posición badge */
        tbody td:nth-child(5) {
            font-weight: 600;
        }
        
        tbody td:nth-child(5)::before {
            content: '⚡';
            margin-right: 5px;
        }
        
        /* Separador HR */
        hr {
            border: none;
            height: 3px;
            background: linear-gradient(90deg, transparent, white, transparent);
            margin: 3rem 0 2rem;
            border-radius: 10px;
            opacity: 0.5;
        }
        
        /* Título del formulario */
        h4 {
            background: white;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
            animation: fadeIn 0.6s ease 0.3s backwards;
        }
        
        h4::before {
            content: '➕';
            margin-right: 10px;
        }
        
        /* Formulario card */
        form {
            background: rgba(255, 255, 255, 0.98);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
            animation: fadeInUp 0.8s ease 0.4s backwards;
            position: relative;
            overflow: hidden;
        }
        
        form::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #667eea, #764ba2, #06b6d4);
        }
        
        /* Inputs mejorados */
        .form-control {
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            padding: 12px 18px;
            font-size: 1rem;
            font-weight: 500;
            transition: all 0.3s ease;
            background: #f9fafb;
        }
        
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.15);
            background: white;
            transform: translateY(-2px);
        }
        
        .form-control::placeholder {
            color: #9ca3af;
            font-weight: 500;
        }
        
        /* Labels con iconos */
        .col-md-4:nth-child(1) .form-control::placeholder::before {
            content: '👤';
        }
        
        /* Botones mejorados */
        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            padding: 14px 40px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 50px;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
            position: relative;
            overflow: hidden;
        }
        
        .btn-primary::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }
        
        .btn-primary:hover::before {
            width: 400px;
            height: 400px;
        }
        
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(102, 126, 234, 0.6);
        }
        
        .btn-primary i {
            margin-right: 8px;
        }
        
        .btn-secondary {
            background: linear-gradient(135deg, #64748b, #475569);
            border: none;
            padding: 14px 40px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 50px;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(71, 85, 105, 0.3);
            color: white;
        }
        
        .btn-secondary:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(71, 85, 105, 0.5);
            background: linear-gradient(135deg, #475569, #334155);
        }
        
        .btn-secondary i {
            margin-right: 8px;
        }
        
        /* Badge contador */
        .player-counter {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            padding: 15px 25px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1rem;
            box-shadow: 0 10px 30px rgba(16, 185, 129, 0.4);
            z-index: 100;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        .player-counter i {
            margin-right: 8px;
            font-size: 1.2rem;
        }
        
        /* Estado vacío */
        .empty-state {
            text-align: center;
            padding: 3rem;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            margin-top: 1rem;
        }
        
        .empty-state i {
            font-size: 4rem;
            color: #cbd5e1;
            margin-bottom: 1rem;
        }
        
        .empty-state p {
            color: #64748b;
            font-weight: 600;
            font-size: 1.1rem;
        }
        
        /* Animación de entrada escalonada */
        .col-md-4, .col-md-2, .col-12 {
            animation: fadeIn 0.6s ease forwards;
            opacity: 0;
        }
        
        .col-md-4:nth-child(1) { animation-delay: 0.5s; }
        .col-md-4:nth-child(2) { animation-delay: 0.6s; }
        .col-md-2:nth-child(3) { animation-delay: 0.7s; }
        .col-md-2:nth-child(4) { animation-delay: 0.8s; }
        .col-12 { animation-delay: 0.9s; }
        
        /* Responsive */
        @media (max-width: 768px) {
            h2 {
                font-size: 2rem;
            }
            
            h4 {
                font-size: 1.5rem;
            }
            
            .table {
                font-size: 0.85rem;
            }
            
            thead th {
                padding: 0.8rem 0.5rem;
                font-size: 0.75rem;
            }
            
            tbody td {
                padding: 0.8rem 0.5rem;
            }
            
            .btn-primary, .btn-secondary {
                padding: 12px 30px;
                font-size: 1rem;
            }
            
            form {
                padding: 1.5rem;
            }
            
            .player-counter {
                bottom: 20px;
                right: 20px;
                padding: 12px 20px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
<div class="container mt-5">
    <h2 th:text="'Jugadores de ' + ${club.nombre}"></h2>

    <div th:if="${success != null}" class="alert alert-success" th:text="${success}"></div>

    <table class="table table-striped mt-3">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Apellido</th>
                <th>Número</th>
                <th>Posición</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="jug : ${jugadores}">
                <td th:text="${jug.id}"></td>
                <td th:text="${jug.nombre}"></td>
                <td th:text="${jug.apellido}"></td>
                <td th:text="${jug.numero}"></td>
                <td th:text="${jug.posicion}"></td>
            </tr>
        </tbody>
    </table>

    <hr>
    
    <h4>Agregar Jugador</h4>
    
    <form th:action="@{/club/{clubId}/jugadores/guardar(clubId=${club.id})}" method="post" class="row g-3">
        <div class="col-md-4">
            <input type="text" name="nombre" class="form-control" placeholder="👤 Nombre" required>
        </div>
        <div class="col-md-4">
            <input type="text" name="apellido" class="form-control" placeholder="📝 Apellido" required>
        </div>
        <div class="col-md-2">
            <input type="number" name="numero" class="form-control" placeholder="🔢 Nº" required>
        </div>
        <div class="col-md-2">
            <input type="text" name="posicion" class="form-control" placeholder="⚡ Posición">
        </div>
        <div class="col-12 mt-2">
            <button type="submit" class="btn btn-primary">
                <i class="bi bi-person-plus-fill"></i>Agregar Jugador
            </button>
            <a th:href="@{/listar}" class="btn btn-secondary">
                <i class="bi bi-arrow-left-circle"></i>Volver
            </a>
        </div>
    </form>
</div>

<!-- Badge contador de jugadores -->
<div class="player-counter">
    <i class="bi bi-people-fill"></i>
    <span th:text="${#lists.size(jugadores)} + ' Jugadores'">0 Jugadores</span>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
